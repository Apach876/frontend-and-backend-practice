<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <link rel="stylesheet" href="../style/styles.css">
    <style>
        .products__grid {
            display: flex;
            flex-direction: row;
            gap: var(--spacing-lg);
            overflow-x: auto;
            padding: var(--spacing-md) 0;
        }

        .product-card {
            min-width: 300px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .products__grid {
                gap: var(--spacing-md);
            }

            .product-card {
                min-width: 250px;
            }
        }

        @media (max-width: 480px) {
            .product-card {
                min-width: 200px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <header class="header">
        <h1 class="header__title">Товары</h1>
    </header>

    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__item">
                <a class="nav__link" href="/index_v1.html">Главная</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="/pages/news_v1.html">Новости</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="/pages/practices_v1.html">Практики</a>
            </li>
            <li class="nav__item nav__item--active">
                <a class="nav__link" href="/pages/goods_v1.html">Товары</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="/pages/contacts_v1.html">Контакты</a>
            </li>
        </ul>
    </nav>


    <main class="main">
        <section class="products">
            <h2 class="products__title">Товары</h2>

            <div class="products__grid">
                <article class="product-card">
                    <header class="product-card__header">
                        <img src="../images/goods1.png" alt="Электрогитара IBANEZ M80M-WK" class="product-card__image">
                        <h3 class="product-card__title">Электрогитара IBANEZ M80M-WK</h3>
                        <div class="product-card__price">203 000 ₽</div>
                    </header>
                </article>

                <article class="product-card">
                    <header class="product-card__header">
                        <img src="../images/goods2.png" alt="Электрогитара Ibanez FTM33-WK" class="product-card__image">
                        <h3 class="product-card__title">Электрогитара Ibanez FTM33-WK</h3>
                        <div class="product-card__price">273 000 ₽</div>
                    </header>
                </article>

                <article class="product-card">
                    <header class="product-card__header">
                        <img src="../images/goods3.png" alt="Электрогитара Ibanez M8M" class="product-card__image">
                        <h3 class="product-card__title">Электрогитара Ibanez M8M</h3>
                        <div class="product-card__price">711 000 ₽</div>
                    </header>
                </article>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2025 Мой сайт</p>
    </footer>
</div>
</body>
</html>
