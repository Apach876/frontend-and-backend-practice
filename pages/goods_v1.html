<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --spacing-sm: 10px;
            --spacing-md: 20px;
            --spacing-lg: 30px;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--nav-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .products__grid {
            display: flex;
            gap: var(--spacing-lg);
            padding: var(--spacing-md) 0;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--nav-active) var(--nav-bg);
            -webkit-overflow-scrolling: touch;
        }

        .products__grid::-webkit-scrollbar {
            height: 8px;
        }

        .products__grid::-webkit-scrollbar-track {
            background: var(--nav-bg);
            border-radius: 4px;
        }

        .products__grid::-webkit-scrollbar-thumb {
            background: var(--nav-active);
            border-radius: 4px;
        }

        .product-card {
            flex: 0 0 auto;
            width: 300px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .product-card__header {
            padding: var(--spacing-md);
        }

        .product-card__image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: var(--spacing-md);
        }

        .product-card__title {
            font-size: 1.3rem;
            margin: 0 0 var(--spacing-sm) 0;
            color: var(--text-color);
        }

        .product-card__price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--nav-active);
        }

        .products__title {
            font-size: 2rem;
            margin: 0 0 var(--spacing-lg) 0;
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            .products__grid {
                gap: var(--spacing-md);
                padding: var(--spacing-sm) 0;
            }

            .product-card {
                width: 280px;
            }

            .product-card__image {
                height: 180px;
            }
        }

        @media (max-width: 480px) {
            .products__title {
                font-size: 1.7rem;
            }

            .product-card {
                width: 260px;
            }

            .product-card__image {
                height: 160px;
            }

            .product-card__title {
                font-size: 1.2rem;
            }

            .product-card__price {
                font-size: 1.3rem;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
                padding: 6px 12px;
                font-size: 13px;
            }
        }

        @media (min-width: 1024px) {
            .products__grid {
                justify-content: center;
                flex-wrap: wrap;
                overflow-x: visible;
            }

            .product-card {
                flex: 0 0 calc(33.333% - var(--spacing-lg));
                max-width: calc(33.333% - var(--spacing-lg));
            }
        }
    </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">Темная тема</button>

<div class="page">
    <header class="header">
        <h1 class="header__title">Товары</h1>
    </header>

    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__item">
                <a class="nav__link" href="../index_v1.html">Главная</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="news_v1.html">Новости</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="practices_v1.html">Практики</a>
            </li>
            <li class="nav__item nav__item--active">
                <a class="nav__link" href="goods_v1.html">Товары</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="contacts_v1.html">Контакты</a>
            </li>
        </ul>
    </nav>

    <main class="main">
        <section class="products">
            <h2 class="products__title">Товары</h2>

            <div class="products__grid">
                <article class="product-card">
                    <header class="product-card__header">
                        <img src="../images/goods1.png" alt="Электрогитара IBANEZ M80M-WK" class="product-card__image">
                        <h3 class="product-card__title">Электрогитара IBANEZ M80M-WK</h3>
                        <div class="product-card__price">203 000 ₽</div>
                    </header>
                </article>

                <article class="product-card">
                    <header class="product-card__header">
                        <img src="../images/goods2.png" alt="Электрогитара Ibanez FTM33-WK" class="product-card__image">
                        <h3 class="product-card__title">Электрогитара Ibanez FTM33-WK</h3>
                        <div class="product-card__price">273 000 ₽</div>
                    </header>
                </article>

                <article class="product-card">
                    <header class="product-card__header">
                        <img src="../images/goods3.png" alt="Электрогитара Ibanez M8M" class="product-card__image">
                        <h3 class="product-card__title">Электрогитара Ibanez M8M</h3>
                        <div class="product-card__price">711 000 ₽</div>
                    </header>
                </article>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2025 Мой сайт</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const themeToggle = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'light';

    document.documentElement.setAttribute('data-theme', currentTheme);
    updateButtonText(currentTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateButtonText(newTheme);
    });

    function updateButtonText(theme) {
        themeToggle.textContent = theme === 'light' ? 'Темная тема' : 'Светлая тема';
    }
</script>
</body>
</html>
